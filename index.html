function forClub(){return '<section class="hero"><section><small>САНКТ-ПЕТЕРБУРГ</small><h1>О клубе «Сет»</h1><p>Торжковская ул., 30А, корп. 1</p></section><div class="heroArt"></div></section><div class="box"><h2>Игра на харде</h2><p class="sub">В клубе четыре корта. Доступны занятия с тренером и групповые тренировки для детей и взрослых.</p><br>'+btn('Выбрать корт',"switchTab('booking')",'primary')+'</div>'}
function admin(){let top='<section class="hero"><section><small>УПРАВЛЕНИЕ КЛУБОМ</small><h1>'+section+'</h1><p>Теннисный клуб «Сет» · Санкт-Петербург</p></section><div class="heroArt"></div></section>';if(section==='Календарь')return top+calendar();if(section==='Корты и цены')return top+settings();if(section==='Диалоги')return top+dialogues();if(section==='Журнал')return top+'<div class="box"><h3>Журнал действий</h3>'+ (D.log.map(l=>'<p class="sub">'+esc(l.at)+' · '+esc(l.who)+' · '+esc(l.s)+'</p>').join('')||'<p>Пока нет изменений.</p>')+'</div>';let bs=D.b.filter(b=>b.status==='paid'&&b.d>=today()&&b.d<add(today(),7)),sum=b=>bs.reduce((s,x)=>s+b(x),0),counts=hours.map(h=>bs.filter(b=>covers(b,h)).length),net=sum(x=>x.total-x.base-x.extras);return top+'<div class="box"><div class="title"><h3>Ближайшие 7 дней</h3>'+badge('Демо-данные')+'</div><div class="cards">'+[['Загрузка',Math.round(sum(x=>x.len)/(7*D.courts.length*hours.length)*100)+'%'],['Выручка',fmt(sum(x=>x.total))],['Эффект динамики',fmt(net)],['Предоплачено',bs.length+' броней'],['Часы без срыва¹',Math.round(sum(x=>x.len)*.1)+' ч'],['Пиковое время',time(hours[counts.indexOf(Math.max(...counts))])]].map(([s,v])=>'<article><small>'+s+'</small><b>'+v+'</b></article>').join('')+'</div><small>¹ Оценка для демонстрации при 10% потенциальных неявок.</small></div><div class="box"><h3>Последние брони</h3>'+bs.slice(-4).reverse().map(b=>record(b,true)).join('')+'</div>' +btn('Сбросить демо-данные','resetDemo()')}
function resetDemo(){if(!confirm('Удалить демо-брони, настройки и начать заново?'))return;D=seed();person='';deviceStore.removeItem(key+'user');save();render()}
function calendar(){let days=weekly?Array.from({length:7},(_,i)=>add(date,i)):[date];return '<div class="box"><div class="title"><div class="row"><input aria-label="Дата календаря" style="width:auto" type="date" value="'+date+'" onchange="if(this.value){date=this.value;render()}">'+btn(weekly?'На день':'На неделю','weekly=!weekly;render()')+'</div><div class="row">'+btn('Создать бронь','editBooking()','primary')+btn('Закрыть корты','blockForm()')+'</div></div><p class="sub">Зелёный — свободно · Серый — оплачено · Жёлтый — резерв · Штриховка — закрыто клубом</p>'+days.map(d=>'<h4 style="margin-top:16px">'+dateLabel(d)+'</h4><div class="scroll"><table><tr><th>Корт</th>'+hours.map(h=>'<th>'+time(h)+'</th>').join('')+'</tr>'+D.courts.map(c=>'<tr><th>'+esc(c.name)+'</th>'+hours.map(h=>{let o=occupied(D,c.n,d,h),s=o?.ns?'block':o?.status==='paid'?'busy':o?'hold':'free';return '<td><button class="'+s+'" onclick="cell('+c.n+',\''+d+'\','+h+')" title="'+esc(o?.name||'Свободно')+'">'+(s==='hold'?Math.ceil((o.until-Date.now())/60000)+'м':s==='block'?'Закр.':s==='busy'?'Опл.':'+')+'</button></td>'}).join('')+'</tr>').join('')+'</table></div>').join('')+'</div>'}
function cell(n,d,h){let o=occupied(D,n,d,h);if(o?.ns)notice(o.name);else if(o)modal('Детали брони',record(o,true));else editBooking(null,n,d,h)}
function moveForm(k){let b=D.b.find(x=>x.id===k);editBooking(b,b.n,b.d,b.h)}
function editBooking(b=null,n=num,d=date,h=hour){modal(b?'Перенос брони':'Ручная бронь','<form class="form" onsubmit="manual(event,\''+(b?.id||'')+'\')">'+inp('Имя игрока','client',b?.name||'')+inp('Телефон','tel',b?.phone||'','tel','')+'<label>Корт<select name="n">'+opts(D.courts.map(c=>c.n),n,v=>id(v).name)+'</select></label>'+inp('Дата','d',d,'date','required min="'+today()+'"')+'<label>Начало<select name="h">'+opts(hours,h,time)+'</select></label>'+inp('Часов','len',b?.len||1,'number','required min="1" max="3"')+'<small>Ручная бронь отмечается оплаченной. При переносе сумма сохраняется.</small><button class="primary">Сохранить</button></form>')}
function manual(e,k){e.preventDefault();D=read();let a=Object.fromEntries(new FormData(e.target)),n=+a.n,h=+a.h,l=+a.len;if(state(n,a.d,h,l,k)!=='free'){alert('Это время недоступно.');return}let b=k?D.b.find(x=>x.id===k):{id:uid(),status:'paid',base:Array.from({length:l},(_,i)=>basePrice(id(n),a.d,h+i)).reduce((a,b)=>a+b),total:quote(n,a.d,h,l),extras:0};Object.assign(b,{n,d:a.d,h,len:l,name:a.client,phone:phone(a.tel)});if(!k)D.b.push(b);audit(k?'Перенос брони':'Ручная бронь');closeDlg()}
function blockForm(){modal('Блокировка кортов','<form class="form" onsubmit="blockSave(event)">'+inp('Причина','reason','Тренировка')+'<div class="row">'+D.courts.map(c=>'<label><input type="checkbox" name="court" value="'+c.n+'"> '+c.n+'</label>').join('')+'</div>'+inp('С даты','d',date,'date','required min="'+today()+'"')+inp('По дату включительно','end',date,'date')+'<label>Повтор<select name="repeat">'+opts(['Разово','Еженедельно'],'Разово')+'</select></label><div class="row">'+['Вс','Пн','Вт','Ср','Чт','Пт','Сб'].map((s,i)=>'<label><input type="checkbox" name="day" value="'+i+'"> '+s+'</label>').join('')+'</div>'+inp('Начало, час','h',hour,'number','required min="7" max="22"')+inp('Количество часов','len',1,'number','required min="1" max="15"')+'<label><input type="checkbox" name="ex" checked> Исключить из расчёта спроса</label><button class="primary">Закрыть время</button></form>')}
function blockSave(e){e.preventDefault();D=read();let f=new FormData(e.target),d=f.get('d'),once=f.get('repeat')==='Разово',r={id:uid(),name:f.get('reason'),from:d,to:once?d:f.get('end'),days:once?[wd(d)]:f.getAll('day').map(Number),ns:f.getAll('court').map(Number),h:+f.get('h'),len:+f.get('len'),exclude:f.has('ex')};if(!r.days.length||!r.ns.length||r.to<d||r.h+r.len>23){alert('Проверьте корты, дни и часы.');return}for(let k=d;k<=r.to;k=add(k,1))if(r.days.includes(wd(k)))for(let n of r.ns)for(let h=r.h;h<r.h+r.len;h++)if(state(n,k,h)!=='free'){alert('Конфликт расписания: '+k+' · '+id(n).name+' · '+time(h));return}D.rules.push(r);audit('Закрыты корты: '+r.name);closeDlg()}
function settings(){return '<div class="box"><h3>Корты и тарифы</h3><div class="cards">'+D.courts.map(c=>'<article><h4>'+esc(c.name)+'</h4><p class="sub">'+esc(c.surface)+' · от '+fmt(Math.min(c.base,c.week,c.eve))+'/ч</p>'+btn('Изменить','courtEdit('+c.n+')')+'</article>').join('')+'</div></div><div class="box"><h3>Правила динамики и отмены</h3><form class="form" onsubmit="rulesSave(event)"><div class="cards">'+D.club.tiers.map(([a,b],i)=>'<article>'+inp('Загрузка выше, %','t'+i,a,'number','required min="0" max="100"')+inp('Надбавка, %','p'+i,b,'number','required min="0" max="200"')+'</article>').join('')+'</div>'+inp('За сколько дней начинается скидка','days',D.club.days,'number','required min="1" max="60"')+inp('Максимальная скидка, %','discount',D.club.discount,'number','required min="0" max="100"')+inp('Отмена до игры, часов','cancel',D.club.cancel,'number','required min="0" max="168"')+'<button>Сохранить правила</button></form></div>'}
function rulesSave(e){e.preventDefault();let f=new FormData(e.target);D.club.tiers=[0,1,2].map(i=>[+f.get('t'+i),+f.get('p'+i)]).sort((a,b)=>a[0]-b[0]);for(let k of ['days','discount','cancel'])D.club[k]=+f.get(k);audit('Обновлены правила клуба');notice('Правила сохранены.')}
function courtEdit(n){let c=id(n);modal('Настройки корта','<form class="form" onsubmit="courtSave(event,'+n+')">'+[['Название','name'],['Покрытие','surface'],['Описание','desc']].map(([s,k])=>inp(s,k,c[k])).join('')+'<label><input type="checkbox" name="inside" '+(c.inside?'checked':'')+'> Крытый корт</label>'+[['Порядок на схеме','pos'],['Будни до 17:00','base'],['Будни с 17:00','eve'],['Выходные','week'],['Минимальная цена','min'],['Максимальная цена','max']].map(([s,k])=>inp(s,k,c[k],'number','required min="1"')).join('')+'<label><input type="checkbox" name="dyn" '+(c.dyn?'checked':'')+'> Динамические цены</label><button>Сохранить</button></form>')}
function courtSave(e,n){e.preventDefault();let f=new FormData(e.target),c=id(n);if(+f.get('max')<+f.get('min')){alert('Потолок цены ниже минимума');return}for(let k of ['name','surface','desc'])c[k]=f.get(k);for(let k of ['pos','min','max','base','week','eve'])c[k]=+f.get(k);c.inside=f.has('inside');c.dyn=f.has('dyn');audit('Обновлён '+c.name);closeDlg()}
function dialogues(){return '<div class="box"><h3>Диалоги игроков</h3>'+ (D.chats.map(c=>'<article class="box"><div class="title"><b>Чат игрока</b>'+badge(c.status)+'</div>'+c.msgs.map(([who,t])=>'<p class="sub"><b>'+who+'</b> · '+esc(t)+'</p>').join('')+'<form class="row" onsubmit="reply(event,\''+c.id+'\')"><input required name="msg" placeholder="Ответ менеджера"><button>Ответить</button></form>'+btn('Решено',"resolveChat('"+c.id+"')")+'</article>').join('')||'<p class="sub">Здесь появится первое обращение из чата клуба.</p>')+'</div><div class="box"><h3>Когда подключать менеджера</h3><div class="form">'+trigs.map((s,i)=>'<label><input type="checkbox" '+(D.triggers[i]?'checked':'')+' onchange="D.triggers['+i+']=this.checked;audit(\'Обновлены триггеры\')"> '+s+'</label>').join('')+'</div></div>'}
function reply(e,k){e.preventDefault();D.chats.find(c=>c.id===k).msgs.push(['Менеджер',e.target.msg.value]);audit('Ответ менеджера');render()}function resolveChat(k){D.chats.find(c=>c.id===k).status='Решено';audit('Диалог решён');render()}
function renderChat(){let c=D.chats.find(c=>c.id===chatId);$('chat').innerHTML=adm?'':btn('◌  Чат клуба','chatOpen=!chatOpen;renderChat()','chatbtn')+(chatOpen?'<section class="box chat"><h3>Ассистент клуба</h3><small>Демо · расписание и условия</small><p>Помогу выбрать корт и время игры.</p>'+ (c?.msgs||[]).map(([w,t])=>'<p><small>'+w+'</small><br>'+esc(t)+'</p>').join('')+'<div class="row">'+btn('Свободное время',"ask('Свободное время')")+btn('Условия отмены',"ask('Условия отмены')")+'</div>'+(c?.offer?btn('Выбрать это время','chatOffer()','lime'):'')+'<form class="form" onsubmit="event.preventDefault();ask(this.q.value)"><input name="q" required placeholder="Ваш вопрос"><button>Отправить</button></form></section>':'');let panel=document.querySelector('.chat');if(panel)panel.scrollTop=panel.scrollHeight}
function ask(q){q=q.trim();if(!q)return;let c=D.chats.find(c=>c.id===chatId);if(!c){c={id:chatId,msgs:[],status:'Ассистент отвечает'};D.chats.push(c)}let h=hour,d=date;let court=D.courts.find(k=>state(k.n,d,h,len)==='free'),text='',trigger=[/оплат|возврат|плат[её]ж/i,/мероприяти|корпоратив|турнир/i,/жалоб|недовол/i,/человек|менеджер|администратор/i].findIndex((r,i)=>D.triggers[i]&&r.test(q));c.offer=null;if(trigger<0){if(/цен|стоим|свобод|врем|когда|сколько/i.test(q)){if(!court){for(let i=0;i<8&&!court;i++){d=add(date,i);for(h of hours){court=D.courts.find(k=>state(k.n,d,h,len)==='free');if(court)break}}}if(court){text=court.name+' свободен '+dateLabel(d)+' в '+time(h)+'. За '+len+' ч — '+fmt(quote(court.n,d,h,len))+'.';c.offer={n:court.n,d,h,l:len}}else text='На ближайшие дни свободного времени не найдено.'}else if(/отмен/i.test(q))text='Отменить игру с возвратом можно минимум за '+D.club.cancel+' ч.';else if(/покрыт|грунт|хард/i.test(q))text=D.courts.map(k=>k.name+' — '+k.surface).join(', ');else if(/групп|заняти|секци|детск|мест[ао]/i.test(q)){text='В «Сете» есть групповые тренировки для детей и взрослых. В демо-календаре детская секция занимает корт 2 по вторникам и четвергам с 18:00 до 20:00. Наличие мест уточняет администратор.';if(/мест|запис/i.test(q)){c.status='Нужен менеджер';text+=' Вопрос передан администратору.'}}else if(/адрес|где/i.test(q))text='Санкт-Петербург, Торжковская ул., 30А, корп. 1.';else trigger=D.triggers[4]?4:-1}if(trigger>=0||c.status==='Нужен менеджер'){text=text||'Подключаю менеджера. Ваш вопрос передан в клуб.';c.status='Нужен менеджер';c.offer=null}else{text=text||'В данных клуба такого ответа пока нет.';c.status='Ассистент отвечает'}c.msgs.push(['Игрок',q],['Ассистент',text]);save();renderChat()}
function chatOffer(){let o=D.chats.find(c=>c.id===chatId).offer;date=o.d;hour=o.h;len=o.l;num=o.n;chatOpen=false;tab='booking';render()}
pick();render();
</script></html>
